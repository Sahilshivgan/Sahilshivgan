<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a">
        <animate attributeName="stop-color" values="#0a0a0a;#0f172a;#1e0a3c;#052e2b;#0a0a0a" dur="16s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#450a0a">
        <animate attributeName="stop-color" values="#450a0a;#1e3a8a;#6b21a8;#0f766e;#450a0a" dur="16s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ef4444">
        <animate attributeName="stop-color" values="#ef4444;#3b82f6;#a855f7;#14b8a6;#ef4444" dur="16s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"><animate attributeName="stop-color" values="#ef4444;#3b82f6;#a855f7;#14b8a6;#ef4444" dur="16s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="220" rx="16" fill="url(#bg)"/>
  <g fill="#ffffff" opacity="0.12">
    <circle cx="120" cy="60" r="50"><animate attributeName="cy" values="60;150;60" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="160" r="70"><animate attributeName="cy" values="160;50;160" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="40" r="25"><animate attributeName="cx" values="700;780;700" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="180" r="35"><animate attributeName="cx" values="300;220;300" dur="8s" repeatCount="indefinite"/></circle>
  </g>
  <text x="500" y="105" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff">Sahil Shivgan</text>
  <text x="500" y="148" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#f1f5f9">Software Engineer  |  Backend &amp; AI/ML</text>
  <rect x="440" y="170" width="120" height="4" rx="2" fill="url(#accent)">
    <animate attributeName="width" values="40;160;40" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="x" values="480;420;480" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
