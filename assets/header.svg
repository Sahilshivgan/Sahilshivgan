<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#1c0a0a"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1000" height="200" rx="14" fill="url(#bg)"/>
  <circle cx="200" cy="60" r="140" fill="url(#glow)">
    <animate attributeName="cx" values="200;800;200" dur="12s" repeatCount="indefinite"/>
  </circle>
  <text x="500" y="98" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="700" fill="#ffffff">Sahil Shivgan</text>
  <text x="500" y="140" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#fca5a5">Software Engineer  |  Backend &amp; AI/ML</text>
  <rect x="440" y="158" width="120" height="3" rx="1.5" fill="#ef4444">
    <animate attributeName="width" values="40;120;40" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="x" values="480;440;480" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
